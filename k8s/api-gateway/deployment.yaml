apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-gateway
  namespace: ai-platform
  labels:
    app: api-gateway

spec:
  replicas: 2

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway
          image: ai-platform-gateway:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000

          env:
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ai-platform-config
                  key: AUTH_SERVICE_URL

            - name: AI_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ai-platform-config
                  key: AI_SERVICE_URL

            - name: RAG_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ai-platform-config
                  key: RAG_SERVICE_URL

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"