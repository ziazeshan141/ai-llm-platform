apiVersion: apps/v1
kind: Deployment

metadata:
  name: rag-service
  namespace: ai-platform
  labels:
    app: rag-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: rag-service

  template:
    metadata:
      labels:
        app: rag-service

    spec:
      containers:
        - name: rag-service
          image: ai-platform-rag:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8003

          env:
            # Secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-platform-secret
                  key: RAG_DATABASE_URL

            # ConfigMap
            - name: EMBEDDING_MODEL
              valueFrom:
                configMapKeyRef:
                  name: ai-platform-config
                  key: EMBEDDING_MODEL

            - name: EMBEDDING_DIMENSION
              valueFrom:
                configMapKeyRef:
                  name: ai-platform-config
                  key: EMBEDDING_DIMENSION

            - name: CHUNK_SIZE
              valueFrom:
                configMapKeyRef:
                  name: ai-platform-config
                  key: CHUNK_SIZE

            - name: CHUNK_OVERLAP
              valueFrom:
                configMapKeyRef:
                  name: ai-platform-config
                  key: CHUNK_OVERLAP

            - name: TOP_K
              valueFrom:
                configMapKeyRef:
                  name: ai-platform-config
                  key: TOP_K

          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1000m"
              memory: "1Gi"