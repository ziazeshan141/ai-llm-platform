apiVersion: apps/v1
kind: Deployment

metadata:
  name: ai-service
  namespace: ai-platform
  labels:
    app: ai-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ai-service

  template:
    metadata:
      labels:
        app: ai-service

    spec:
      containers:
        - name: ai-service
          image: ai-platform-ai:rag-v1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8002

          env:
            # ==================================================
            # LLM Configuration - ConfigMap
            # ==================================================

            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: ai-platform-config
                  key: LLM_MODEL

            - name: LLM_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: ai-platform-config
                  key: LLM_BASE_URL

            # ==================================================
            # RAG Configuration - ConfigMap
            # ==================================================

            - name: RAG_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ai-platform-config
                  key: RAG_SERVICE_URL

            - name: RAG_TOP_K
              valueFrom:
                configMapKeyRef:
                  name: ai-platform-config
                  key: RAG_TOP_K

            - name: RAG_MAX_DISTANCE
              valueFrom:
                configMapKeyRef:
                  name: ai-platform-config
                  key: RAG_MAX_DISTANCE

            # ==================================================
            # Secrets
            # ==================================================

            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-platform-secret
                  key: LLM_API_KEY

          # ====================================================
          # Readiness Probe
          # ====================================================

          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # ====================================================
          # Liveness Probe
          # ====================================================

          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          # ====================================================
          # Resources
          # ====================================================

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"