apiVersion: v1
kind: Secret

metadata:
  name: ai-platform-secret
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: ai-platform
    app.kubernetes.io/part-of: ai-llm-platform

type: Opaque

stringData:
  # Auth Service
  JWT_SECRET_KEY: "local-dev-jwt-secret-change-me"

  # PostgreSQL credentials
  POSTGRES_USER: "ai_platform"
  POSTGRES_PASSWORD: "ai_platform_dev_password"

  # Application database connections
  AUTH_DATABASE_URL: "postgresql://ai_platform:ai_platform_dev_password@postgres:5432/auth_db"
  RAG_DATABASE_URL: "postgresql://ai_platform:ai_platform_dev_password@postgres:5432/rag_db"

  # OpenAI-compatible vLLM API key.
  # Local vLLM does not require a real OpenAI key.
  LLM_API_KEY: "local-vllm"